name: ClaimVision CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: claimvision_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set DATABASE_URL for CI PostgreSQL service
      run: |
        echo "DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@localhost:5432/claimvision_db" >> $GITHUB_ENV

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Run End-to-End Pipeline in Sample Mode
      run: |
        python run_pipeline.py --sample
